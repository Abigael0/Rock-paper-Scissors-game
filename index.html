
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors | Sign In</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <main class="login-container">
        <div class="game-icons">
            <span>✊</span>
            <span>✋</span>
            <span>✌️</span>
        </div>

        <h1>ROCK, PAPER <span>SCISSORS</span></h1>
        <p class="subtitle">Ready to play? Enter your email to get started.</p>

        <form action="game.html" method="get">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <button type="submit">SIGN IN <span>→</span></button>
        </form>

        <p class="footer-text">Choose your move. Claim your victory.</p>
    </main>
</body>
</html>
